# Digits dashboard for the managed tmux session "ai-agents".
#
# Sourced by ~/.local/bin/ai-agents on every launch. Every setting here is
# scoped to the ai-agents session except the two status-line mouse bindings,
# which are server-wide but only change behaviour inside ai-agents. Sourcing
# this file again is harmless and keeps pane options such as waiting reasons.
#
# Pane options read here are published by the env-dashboard Copilot CLI
# extension: @env-copilot-state, @env-copilot-since, @env-copilot-took,
# @env-dashboard-owner. Waiting reasons (@env-waiting-reason/-owner) are set
# with a right click on an idle chat's status entry.

# --- Session options ---------------------------------------------------------

set -t ai-agents status 5
set -t ai-agents status-position top
set -t ai-agents status-interval 1
set -t ai-agents set-titles on
set -t ai-agents set-titles-string '🫲 AI Agents 🫱'
set -t ai-agents status-style 'bg=colour235,fg=colour252'

# --- Derived per-pane values ---------------------------------------------------
# Each option is a format evaluated for the active pane of the window drawn.

# Every label an idle chat may publish (older extensions used several).
set -t ai-agents @hand-status-idle-pattern '^(YOUR TURN|ACTION|ANSWERED|BLOCKED|COMPLETE|DECIDE|PARKED|REVIEW|WAITING)$'

# Another agent host (for example Claude Code through hooks): a pane whose
# integration has marked it (@env-dashboard-host) and whose foreground program
# is not a plain shell. The shell test means a chat that crashed without cleaning
# up shows READY again. Hosts are not matched by name: Claude Code, for one,
# reports its version number as the pane's current command.
set -t ai-agents @hand-status-agent '#{&&:#{!=:#{@env-dashboard-host},},#{!=:#{m/r:^(fish|zsh|bash|sh|dash|ksh)$,#{pane_current_command}},1}}'

# Dead pane: ERROR. Copilot, or another host (above): its published state (idle labels fold into
# YOUR TURN; nothing published yet: COPILOT). Plain shell: READY. Any other
# foreground program: WORKING.
set -t ai-agents @hand-status-activity '#{?pane_dead,ERROR,#{?#{||:#{==:#{pane_current_command},copilot},#{E:@hand-status-agent}},#{?#{!=:#{@env-copilot-state},},#{?#{m/r:#{@hand-status-idle-pattern},#{@env-copilot-state}},YOUR TURN,#{@env-copilot-state}},COPILOT},#{?#{m/r:^(fish|zsh|bash|sh|dash|ksh)$,#{pane_current_command}},READY,WORKING}}}'

set -t ai-agents @hand-status-idle '#{m/r:#{@hand-status-idle-pattern},#{E:@hand-status-activity}}'

set -t ai-agents @hand-status-state '#{?#{&&:#{E:@hand-status-idle},#{!=:#{@env-waiting-reason},}},WAITING,#{E:@hand-status-activity}}'

set -t ai-agents @hand-status-state-style '#{?#{==:#{E:@hand-status-state},WATCHING},#[fg=colour117],#{?#{==:#{E:@hand-status-state},SUBAGENTS},#[fg=colour141],#{?#{==:#{E:@hand-status-state},NEEDS YOU},#[fg=colour214],#{?#{==:#{E:@hand-status-state},QUESTION},#[fg=colour213],#{?#{==:#{E:@hand-status-state},ERROR},#[fg=colour203],#{?#{==:#{E:@hand-status-state},WORKING},#[fg=colour75],#{?#{==:#{E:@hand-status-state},YOUR TURN},#[fg=colour226],#[fg=colour244]}}}}}}}'

# Current Unix seconds: "%s" goes through strftime at every render (T:).
set -t ai-agents @hand-status-now '%s'

set -t ai-agents @hand-status-age '#{e|-|:#{T:@hand-status-now},#{@env-copilot-since}}'

set -t ai-agents @hand-status-span '#{?#{==:#{E:@hand-status-state},YOUR TURN},#{@env-copilot-took},#{E:@hand-status-age}}'

# A clock that moved backwards shows 0s rather than a negative duration.
set -t ai-agents @hand-status-seconds '#{?#{e|<|:#{E:@hand-status-span},0},0,#{E:@hand-status-span}}'

# 59s, 1m0s, 1h0m, 1d0h ...
set -t ai-agents @hand-status-duration '#{?#{e|<|:#{E:@hand-status-seconds},60},#{E:@hand-status-seconds}s,#{?#{e|<|:#{E:@hand-status-seconds},3600},#{e|/|:#{E:@hand-status-seconds},60}m#{e|m|:#{E:@hand-status-seconds},60}s,#{?#{e|<|:#{E:@hand-status-seconds},86400},#{e|/|:#{E:@hand-status-seconds},3600}h#{e|m|:#{e|/|:#{E:@hand-status-seconds},60},60}m,#{e|/|:#{E:@hand-status-seconds},86400}d#{e|m|:#{e|/|:#{E:@hand-status-seconds},3600},24}h}}}'

# Local HH:MM of @env-copilot-since, taken from tmux's own local time text
# (for example "Sat Sep  8 18:46:40 2001"). The pattern avoids "%" and ":" so
# nothing is lost when the format is expanded inside other formats.
set -t ai-agents @hand-status-clock '#{s/^.*[^0-9]([0-9][0-9].[0-9][0-9]).[0-9][0-9][^0-9].*$/\1/:#{t:@env-copilot-since}}'

set -t ai-agents @hand-status-timer '#{?#{&&:#{||:#{==:#{pane_current_command},copilot},#{E:@hand-status-agent}},#{!=:#{@env-copilot-since},}},#{?#{m/r:^(WORKING|SUBAGENTS|WATCHING)$,#{E:@hand-status-activity}},#{E:@hand-status-duration},#{?#{==:#{E:@hand-status-state},YOUR TURN},#{?#{!=:#{@env-copilot-took},},#{E:@hand-status-duration} ,}@#{E:@hand-status-clock},#{?#{==:#{E:@hand-status-state},WAITING},#{E:@hand-status-duration} ago,}}},}'

# Waiting reason (styles neutralised) followed by the chat name: Copilot's
# with its suffix removed, another host's pane title with styles neutralised.
set -t ai-agents @hand-status-title '#{?#{&&:#{E:@hand-status-idle},#{!=:#{@env-waiting-reason},}},Waiting on: #{s/#\[/# [/:@env-waiting-reason} | ,}#{?#{==:#{pane_current_command},copilot},#{s/^GitHub Copilot$//:#{s/ - GitHub Copilot$//:pane_title}},#{?#{E:@hand-status-agent},#{s/#\[/# [/:pane_title},}}'

set -t ai-agents @hand-status-title-width '#{e|-|:#{e|/|:#{client_width},2},49}'

# Truncates and pads the space-padded title to exactly the title width.
set -t ai-agents @hand-status-title-fit '^(.{#{E:@hand-status-title-width}}).*$'

# --- Status layout -----------------------------------------------------------

set -t ai-agents @hand-status-cell '#[range=window|#{window_index}]#{?window_active,#[bg=colour238 bold],} #{p4:#{window_index}:}#{p14:window_name} #{E:@hand-status-state-style}#{p10:#{E:@hand-status-state}} #{p13:#{E:@hand-status-timer}}#[fg=colour252] #{?#{e|>|:#{E:@hand-status-title-width},0},#{s/#{E:@hand-status-title-fit}/\1/:#{p320:#{E:@hand-status-title}}},}#[default]#[norange]'

set -t ai-agents status-format[0] '#{W:#{?#{==:#{window_index},1},#{E:@hand-status-cell},}}#{W:#{?#{==:#{window_index},6},#{E:@hand-status-cell},}}#[align=right range=user|keys bg=colour31 fg=colour231 bold] hotkeys #[norange default]'
set -t ai-agents status-format[1] '#{W:#{?#{==:#{window_index},2},#{E:@hand-status-cell},}}#{W:#{?#{==:#{window_index},7},#{E:@hand-status-cell},}}'
set -t ai-agents status-format[2] '#{W:#{?#{==:#{window_index},3},#{E:@hand-status-cell},}}#{W:#{?#{==:#{window_index},8},#{E:@hand-status-cell},}}'
set -t ai-agents status-format[3] '#{W:#{?#{==:#{window_index},4},#{E:@hand-status-cell},}}#{W:#{?#{==:#{window_index},9},#{E:@hand-status-cell},}}'
set -t ai-agents status-format[4] '#{W:#{?#{==:#{window_index},5},#{E:@hand-status-cell},}}#{W:#{?#{==:#{window_index},10},#{E:@hand-status-cell},}}'

# --- Waiting reasons ---------------------------------------------------------

# Clear a pane's waiting reason once its chat is no longer idle or another
# Copilot process has taken over the pane. Only the pane whose option changed
# is evaluated and touched.
set-hook -t ai-agents 'after-set-option[71]' {
  if -F '#{&&:#{!=:#{@env-waiting-reason},},#{||:#{!=:#{m/r:#{@hand-status-idle-pattern},#{@env-copilot-state}},1},#{!=:#{@env-waiting-owner},#{@env-dashboard-owner}}}}' {
    set -p -u @env-waiting-reason
    set -p -u @env-waiting-owner
  }
}

# --- Mouse -------------------------------------------------------------------

# Left click: the hotkeys button opens the shortcuts menu inside ai-agents;
# everything else keeps tmux's default (select the clicked window).
bind -n MouseDown1Status if -F '#{&&:#{==:#{session_name},ai-agents},#{==:#{mouse_status_range},keys}}' {
  display-menu -O -T '#[align=centre fg=colour117] Digits shortcuts ' -x R -y S -b rounded -s 'fg=colour252,bg=terminal' -S 'fg=colour240,bg=terminal' -H 'fg=colour235,bg=colour117' \
    ' Next chat needing attention   Cmd+`                   ' '' { run-shell 'exec "$HOME/.local/bin/ai-agents" --next-attention' } \
    ' Open newest session Markdown  Cmd+Shift+M             ' '' { run-shell 'exec "$HOME/.local/bin/ai-agents" --markdown "#{pane_id}" --client "#{client_name}"' } \
    ' Next window                   Cmd+Shift+]             ' '' { next-window } \
    ' Previous window               Cmd+Shift+[             ' '' { previous-window } \
    ' Last window                   Cmd+;                   ' '' { last-window } \
    '' \
    '- Window 1-10                   Cmd+1 ... Cmd+9, Cmd+0  ' '' '' \
    '- Switch chat                   Click its entry         ' '' '' \
    '- Set waiting reason            Right-click an idle chat' '' '' \
    '- Open a link                   Shift+Cmd+click         ' '' ''
} {
  switch-client -t =
}

# Right click: inside ai-agents, edit the clicked idle chat's waiting reason;
# elsewhere, tmux's standard window menu.
bind -n MouseDown3Status if -F '#{==:#{session_name},ai-agents}' {
  select-window -t =
  if -F '#{E:@hand-status-idle}' {
    # The template is a plain string (not a braced block) so that, after %%%
    # substitution, it is parsed exactly once. The response is stored in a
    # draft option and copied with -F, so it is never re-parsed or expanded.
    command-prompt -p 'Waiting on (empty clears)' -I '#{@env-waiting-reason}' 'set -p @hand-status-draft "%%%" ; if -F "#{E:@hand-status-idle}" { set -p -F @env-waiting-owner "#{@env-dashboard-owner}" ; set -p -F @env-waiting-reason "#{@hand-status-draft}" } { display-message "This chat stopped being idle, so the waiting reason was not saved" } ; set -p -u @hand-status-draft'
  } {
    display-message 'Waiting reasons can only be set on idle chats'
  }
} {
  display-menu -T '#[align=centre]#{window_index}:#{window_name}' -t = -x W -y W \
    '#{?#{>:#{session_windows},1},,-}Swap Left' l { swap-window -t :-1 } \
    '#{?#{>:#{session_windows},1},,-}Swap Right' r { swap-window -t :+1 } \
    '#{?pane_marked_set,,-}Swap Marked' s { swap-window } \
    '' \
    'Kill' X { kill-window } \
    'Respawn' R { respawn-window -k } \
    '#{?pane_marked,Unmark,Mark}' m { select-pane -m } \
    'Rename' n { command-prompt -F -I '#W' { rename-window -t '#{window_id}' '%%' } } \
    '' \
    'New After' w { new-window -a } \
    'New At End' W { new-window }
}
